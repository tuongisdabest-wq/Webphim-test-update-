<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Flappy PvP — P2P</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3;
    display: flex; flex-direction: column; align-items: center;
  }
  #lobby { width: 100%; max-width: 420px; padding: 16px; text-align: center; }
  h1 { font-size: 1.25rem; margin: 6px 0; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 14px; margin: 10px 0; }
  button { width: 100%; padding: 12px; font-size: 1rem; border: none; border-radius: 8px; background: #238636; color: #fff; margin-top: 8px; }
  button.secondary { background: #21262d; border: 1px solid #30363d; color: #e6edf3; }
  #status { font-size: 0.85rem; color: #8b949e; min-height: 34px; }
  #qrHost { display: flex; justify-content: center; margin: 10px auto; background: #fff; padding: 6px; border-radius: 8px; width: fit-content; }
  video#scanVideo { width: 100%; border-radius: 8px; display: none; margin-top: 8px; }
  .hidden { display: none !important; }

  #gameView { display: none; width: 100%; height: 100dvh; flex-direction: column; }
  .half { flex: 1; position: relative; overflow: hidden; }
  #opponentHalf { border-bottom: 2px solid #58a6ff; }
  .label { position: absolute; top: 6px; left: 8px; font-size: 0.7rem; color: rgba(255,255,255,0.6); z-index: 2; }
  .scoreTag { position: absolute; top: 6px; right: 8px; font-size: 0.9rem; font-weight: bold; z-index: 2; }
  canvas { width: 100%; height: 100%; display: block; }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; background: rgba(0,0,0,0.75); z-index: 10; text-align: center; padding: 20px;
  }
  #overlay h2 { font-size: 1.8rem; margin-bottom: 6px; }
  #overlay button { max-width: 240px; }
</style>
</head>
<body>

<div id="lobby">
  <h1>🐤 Flappy PvP — Ngang hàng (P2P)</h1>
  <div id="status">Chọn vai trò để bắt đầu kết nối.</div>

  <div class="card" id="choiceCard">
    <button id="btnHost">Tạo kết nối (Host)</button>
    <button id="btnGuest" class="secondary">Quét để tham gia (Guest)</button>
  </div>

  <div class="card hidden" id="hostCard">
    <div>Bảo đối thủ quét mã này:</div>
    <div id="qrHost"></div>
    <button id="btnScanAnswer" class="secondary">📷 Quét mã trả lời từ đối thủ</button>
  </div>

  <div class="card hidden" id="scanCard">
    <video id="scanVideo" autoplay playsinline muted></video>
    <div id="scanHint" style="font-size:0.8rem;color:#8b949e;margin-top:6px"></div>
  </div>

  <div class="card hidden" id="answerCard">
    <div>Đưa mã này lại cho Host quét:</div>
    <div id="qrAnswer" style="display:flex;justify-content:center;margin:10px auto;background:#fff;padding:6px;border-radius:8px;width:fit-content"></div>
  </div>
</div>

<div id="gameView">
  <div class="half" id="opponentHalf">
    <div class="label">Đối thủ</div>
    <div class="scoreTag" id="oppScore">0</div>
    <canvas id="opponentCanvas"></canvas>
  </div>
  <div class="half" id="myHalf">
    <div class="label">Bạn</div>
    <div class="scoreTag" id="myScore">0</div>
    <canvas id="myCanvas"></canvas>
  </div>
</div>

<div id="overlay">
  <h2 id="overlayTitle"></h2>
  <p id="overlaySub" style="color:#8b949e"></p>
  <button id="btnRestart">Chơi lại (tạo kết nối mới)</button>
</div>

<script>
/* ============ Helpers: compress + QR + scan ============ */
function toB64Url(bytes) {
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function fromB64Url(str) {
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while (str.length % 4) str += '=';
  const bin = atob(str);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function packPayload(obj) {
  const json = JSON.stringify(obj);
  const deflated = pako.deflate(json);
  return toB64Url(deflated);
}
function unpackPayload(str) {
  const bytes = fromB64Url(str);
  const json = pako.inflate(bytes, { to: 'string' });
  return JSON.parse(json);
}
function renderQR(containerEl, text) {
  containerEl.innerHTML = '';
  new QRCode(containerEl, { text, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.L });
}

async function waitIceGatheringComplete(pc) {
  if (pc.iceGatheringState === 'complete') return;
  await new Promise(resolve => {
    function check() {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
    }
    pc.addEventListener('icegatheringstatechange', check);
    setTimeout(resolve, 4000); // safety timeout — use whatever candidates we have
  });
}

/* ============ Camera QR scanning (shared by both roles) ============ */
const scanVideo = document.getElementById('scanVideo');
const scanCard = document.getElementById('scanCard');
const scanHint = document.getElementById('scanHint');
let scanStream = null, scanning = false, scanResolve = null;
const scanCanvas = document.createElement('canvas');
const scanCtx = scanCanvas.getContext('2d');

function scanQR(hintText) {
  return new Promise(async (resolve, reject) => {
    scanResolve = resolve;
    scanCard.classList.remove('hidden');
    scanHint.textContent = hintText;
    scanVideo.style.display = 'block';
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      scanVideo.srcObject = scanStream;
      scanning = true;
      requestAnimationFrame(scanFrame);
    } catch (e) { reject(e); }
  });
}
function stopScan() {
  scanning = false;
  scanVideo.style.display = 'none';
  scanCard.classList.add('hidden');
  if (scanStream) scanStream.getTracks().forEach(t => t.stop());
}
function scanFrame() {
  if (!scanning) return;
  if (scanVideo.readyState === scanVideo.HAVE_ENOUGH_DATA) {
    scanCanvas.width = scanVideo.videoWidth;
    scanCanvas.height = scanVideo.videoHeight;
    scanCtx.drawImage(scanVideo, 0, 0, scanCanvas.width, scanCanvas.height);
    const imgData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
    const code = jsQR(imgData.data, imgData.width, imgData.height);
    if (code && code.data) {
      stopScan();
      scanResolve && scanResolve(code.data);
      return;
    }
  }
  requestAnimationFrame(scanFrame);
}

/* ============ WebRTC setup ============ */
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }]; // fallback only; LAN uses host candidates
let pc, dataChannel;
let seed, mySeededRandom;
const statusEl = document.getElementById('status');

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function setupDataChannelEvents(dc) {
  dc.onopen = () => { statusEl.textContent = 'Đã kết nối! Bắt đầu...'; startGame(); };
  dc.onclose = () => { showOverlay('Đối thủ đã rời', 'Kết nối đã đóng.'); };
  dc.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    onOpponentMessage(msg);
  };
}

/* ---- HOST flow ---- */
document.getElementById('btnHost').onclick = async () => {
  document.getElementById('choiceCard').classList.add('hidden');
  document.getElementById('hostCard').classList.remove('hidden');
  statusEl.textContent = 'Đang tạo mã mời...';

  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  dataChannel = pc.createDataChannel('game');
  setupDataChannelEvents(dataChannel);

  seed = Math.floor(Math.random() * 1e9);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitIceGatheringComplete(pc);

  const payload = { type: 'offer', sdp: pc.localDescription.sdp, seed, role: 'guest' };
  const packed = packPayload(payload);
  renderQR(document.getElementById('qrHost'), packed);
  statusEl.textContent = 'Đưa mã QR cho đối thủ quét (cùng wifi).';
};

document.getElementById('btnScanAnswer').onclick = async () => {
  try {
    const data = await scanQR('Quét mã QR trả lời từ máy đối thủ...');
    const payload = unpackPayload(data);
    if (payload.type !== 'answer') throw new Error('Mã không đúng loại (cần mã trả lời)');
    await pc.setRemoteDescription({ type: 'answer', sdp: payload.sdp });
    statusEl.textContent = 'Đang thiết lập kết nối trực tiếp...';
  } catch (e) {
    statusEl.textContent = 'Lỗi quét/đọc mã: ' + e.message;
  }
};

/* ---- GUEST flow ---- */
document.getElementById('btnGuest').onclick = async () => {
  document.getElementById('choiceCard').classList.add('hidden');
  try {
    const data = await scanQR('Quét mã QR mời từ máy Host...');
    const payload = unpackPayload(data);
    if (payload.type !== 'offer') throw new Error('Mã không đúng loại (cần mã mời)');
    seed = payload.seed;

    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    pc.ondatachannel = (ev) => { dataChannel = ev.channel; setupDataChannelEvents(dataChannel); };

    await pc.setRemoteDescription({ type: 'offer', sdp: payload.sdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await waitIceGatheringComplete(pc);

    const answerPayload = { type: 'answer', sdp: pc.localDescription.sdp };
    const packed = packPayload(answerPayload);
    document.getElementById('answerCard').classList.remove('hidden');
    renderQR(document.getElementById('qrAnswer'), packed);
    statusEl.textContent = 'Đưa mã này lại cho Host quét để hoàn tất.';
  } catch (e) {
    statusEl.textContent = 'Lỗi: ' + e.message;
  }
};

/* ============ Game ============ */
const lobbyEl = document.getElementById('lobby');
const gameViewEl = document.getElementById('gameView');
const overlayEl = document.getElementById('overlay');

const GRAVITY = 1400, FLAP_V = -420, PIPE_GAP = 200, PIPE_W = 70, PIPE_SPEED = 160, PIPE_INTERVAL = 1.4;
let myCtx, oppCtx, myCanvas, oppCanvas;
let my, opp; // {y, vy, score, dead, pipes:[], pipeTimer}
let lastT, rafId;

function makeState() {
  return { y: 0, vy: 0, score: 0, dead: false, pipes: [], pipeTimer: 0 };
}

function startGame() {
  lobbyEl.style.display = 'none';
  gameViewEl.style.display = 'flex';
  myCanvas = document.getElementById('myCanvas');
  oppCanvas = document.getElementById('opponentCanvas');
  [myCanvas, oppCanvas].forEach(c => {
    c.width = c.parentElement.clientWidth * devicePixelRatio;
    c.height = c.parentElement.clientHeight * devicePixelRatio;
  });
  myCtx = myCanvas.getContext('2d');
  oppCtx = oppCanvas.getContext('2d');

  mySeededRandom = mulberry32(seed); // both peers use identical seed -> identical pipe layout
  my = makeState(); my.y = myCanvas.height / 2;
  opp = makeState(); opp.y = oppCanvas.height / 2;

  const flap = () => { if (!my.dead) my.vy = FLAP_V; };
  document.addEventListener('keydown', e => { if (e.code === 'Space') flap(); });
  gameViewEl.addEventListener('touchstart', flap);
  gameViewEl.addEventListener('mousedown', flap);

  lastT = performance.now();
  rafId = requestAnimationFrame(loop);
}

function spawnPipe(canvasH, canvasW) {
  const margin = 80;
  const gapY = margin + mySeededRandom() * (canvasH - margin * 2 - PIPE_GAP);
  return { x: canvasW + PIPE_W, gapY, passed: false };
}

function updateBird(state, canvasH, dt) {
  if (state.dead) return;
  state.vy += GRAVITY * dt;
  state.y += state.vy * dt;
  if (state.y > canvasH - 16 || state.y < 16) { state.dead = true; }
}

function updatePipes(state, canvasW, canvasH, dt, birdX) {
  state.pipeTimer -= dt;
  if (state.pipeTimer <= 0) {
    state.pipes.push(spawnPipe(canvasH, canvasW));
    state.pipeTimer = PIPE_INTERVAL;
  }
  state.pipes.forEach(p => p.x -= PIPE_SPEED * dt);
  state.pipes = state.pipes.filter(p => p.x > -PIPE_W);

  if (!state.dead) {
    for (const p of state.pipes) {
      if (!p.passed && p.x + PIPE_W < birdX) { p.passed = true; state.score++; }
      const withinX = birdX + 14 > p.x && birdX - 14 < p.x + PIPE_W;
      if (withinX) {
        const inGap = state.y - 14 > p.gapY && state.y + 14 < p.gapY + PIPE_GAP;
        if (!inGap) state.dead = true;
      }
    }
  }
}

function drawScene(ctx, canvas, state, color) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#3fb950';
  state.pipes.forEach(p => {
    ctx.fillRect(p.x, 0, PIPE_W, p.gapY);
    ctx.fillRect(p.x, p.gapY + PIPE_GAP, PIPE_W, canvas.height - (p.gapY + PIPE_GAP));
  });
  ctx.fillStyle = state.dead ? '#f85149' : color;
  ctx.beginPath();
  ctx.arc(canvas.width / 4, state.y, 16, 0, Math.PI * 2);
  ctx.fill();
}

let sendTimer = 0;
function loop(t) {
  const dt = Math.min((t - lastT) / 1000, 0.033);
  lastT = t;

  updateBird(my, myCanvas.height, dt);
  updatePipes(my, myCanvas.width, myCanvas.height, dt, myCanvas.width / 4);
  drawScene(myCtx, myCanvas, my, '#58a6ff');
  drawScene(oppCtx, oppCanvas, opp, '#f85149');
  document.getElementById('myScore').textContent = my.score;
  document.getElementById('oppScore').textContent = opp.score;

  sendTimer -= dt;
  if (sendTimer <= 0 && dataChannel && dataChannel.readyState === 'open') {
    dataChannel.send(JSON.stringify({ t: 's', y: my.y, score: my.score, dead: my.dead }));
    sendTimer = 1 / 30; // ~30 updates/sec
  }

  if (my.dead && opp.dead) {
    endGame();
  } else {
    rafId = requestAnimationFrame(loop);
  }
}

function onOpponentMessage(msg) {
  if (msg.t === 's') {
    opp.y = msg.y; opp.score = msg.score;
    if (msg.dead && !opp.dead) { opp.dead = true; checkEndFromOpponent(); }
  }
}
function checkEndFromOpponent() {
  if (my.dead && opp.dead) endGame();
  else if (opp.dead && !my.dead) { /* keep playing solo until you also die or win by survival */ }
}

function endGame() {
  cancelAnimationFrame(rafId);
  let title, sub;
  if (my.dead && !opp.dead) { title = 'Bạn thua 😵'; sub = 'Đối thủ vẫn đang bay.'; }
  else if (!my.dead && opp.dead) { title = 'Bạn thắng 🎉'; sub = 'Đối thủ đã rớt trước.'; }
  else { title = my.score === opp.score ? 'Hoà!' : (my.score > opp.score ? 'Bạn thắng 🎉' : 'Bạn thua 😵'); sub = `Điểm: ${my.score} - ${opp.score}`; }
  showOverlay(title, sub);
}
function showOverlay(title, sub) {
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlaySub').textContent = sub;
  overlayEl.style.display = 'flex';
}
document.getElementById('btnRestart').onclick = () => location.reload();
</script>
</body>
</html>
